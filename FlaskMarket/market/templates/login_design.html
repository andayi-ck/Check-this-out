

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock Health Login</title>
    <!-- Optional: Add Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* General Body Styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif; /* Or a more modern sans-serif font */
            /* !!! REPLACE 'livestock_background.jpg' with an actual path or URL to your background image !!! */
            background-image: url('https://images.unsplash.com/photo-1589997446816-a97963f91107?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8Y2F0dGxlJTIwZmFybXxlbnwwfHwwfHx8MA%3D%3D&auto=format&fit=crop&w=1200&q=60'); /* Example Unsplash Image */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff; /* Default text color (can be overridden) */
            position: relative; /* For the overlay */
        }

        /* Background Overlay/Tint */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 30, 60, 0.65); /* Dark blueish tint - adjust color and opacity */
            z-index: 1;
        }

        /* Login Container */
        .login-container {
            position: relative; /* To be above the overlay */
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        .login-box {
            background-color: rgba(0, 0, 0, 0.0); /* Making the box itself transparent */
            padding: 30px 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 380px; /* Adjust as needed for mobile screen width */
            text-align: center;
        }

        /* Logo */
        .logo-container {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container .logo {
            /* !!! REPLACE 'logo_placeholder.png' with an actual path or URL to your logo image !!! */
            max-width: 180px; /* Adjust as needed */
            height: auto;
            margin-bottom: 5px; /* If you have text below the image logo */
        }
        /* If you don't have an image logo yet, you can use text: */
        .logo-container .logo-text-fallback h1 {
            font-size: 2.5rem;
            color: #fff;
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .logo-container .logo-text-fallback h2 {
            font-size: 0.8rem;
            color: #ccc;
            margin: 0;
            font-weight: normal;
            letter-spacing: 2px;
            text-transform: uppercase;
        }


        /* Input Fields */
        .login-form .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .login-form .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #ccc; /* Icon color */
            font-size: 1.1em;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: calc(100% - 40px); /* Account for padding and icon */
            padding: 12px 15px 12px 45px; /* Left padding for icon */
            border: 1px solid rgba(255, 255, 255, 0.3); /* Light border */
            border-radius: 25px; /* Rounded corners */
            background-color: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .login-form input[type="text"]::placeholder,
        .login-form input[type="password"]::placeholder {
            color: #bbb; /* Placeholder text color */
        }

        .login-form input[type="text"]:focus,
        .login-form input[type="password"]:focus {
            border-color: #4CAF50; /* Green border on focus (matches button) */
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* Button */
        .btn-secure {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50; /* Green color from image */
            color: white;
            border: none;
            border-radius: 25px; /* Rounded corners */
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px; /* Space above links */
            text-transform: uppercase;
        }

        .btn-secure:hover {
            background-color: #45a049; /* Darker green on hover */
        }

        /* Links below button */
        .links-container {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; /* Space between the links */
        }

        .links-container a {
            color: #b0e0e6; /* Light blue/powder blue for links */
            text-decoration: none;
            font-size: 0.9em;
        }

        .links-container a:hover {
            text-decoration: underline;
            color: #fff;
        }

        /* Responsive adjustments if needed */
        @media (max-width: 480px) {
            .login-box {
                padding: 20px;
            }
            .logo-container .logo {
                max-width: 150px;
            }
             .logo-container .logo-text-fallback h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-container">
                <!-- IMPORTANT: Replace 'logo_placeholder.png' with the actual path or URL to your logo image -->
                <!-- If you have an image logo: -->
                <img src="logo_placeholder.png" alt="Livestock Health Co Logo" class="logo">

                <!-- OR, if you DON'T have an image logo yet and want to use text (like the example in the image): -->
                <!--
                <div class="logo-text-fallback">
                    <span style="font-size: 3rem; color: white; display: block; margin-bottom: -10px;"><i class="fas fa-truck"></i></span>
                    <h1>Livestock</h1>
                    <h2>HEALTH . CO</h2>
                </div>
                -->
            </div>

            <form action="#" method="POST" class="login-form">
                <div class="input-group">
                    <span class="input-icon"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" placeholder="Username or Email" required>
                </div>
                <div class="input-group">
                    <span class="input-icon"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-secure">SECURE</button>
            </form>

            <div class="links-container">
                <a href="#" class="forgot-pin">Forgot PIN?</a>
                <a href="#" class="create-profile">Create an Civil profile</a>
            </div>
        </div>
    </div>
</body>
</html>
